[project]
name = "biomant"
version = "0.3.0"
description = "Sistema de gestión de equipos médicos para instituciones hospitalarias y equipos de mantenimiento"
requires-python = ">=3.15.1"

dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.3,<3.0",
    "pydantic>=2.14.1,<3.0",
    "alembic>=1.20.1",
    "mysql-connector-python>=26.7.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.17.3",
    "mypy>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
files = ["main.py", "routers", "crud", "models", "schemas", "database"]
check_untyped_defs = true